<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>matchaxmoxie</title>
  <meta name="description" content="matchaxmoxie: an independent STEM classroom by Jade Zhao.">
  <link rel="canonical" href="https://matchaxmoxie.github.io/matchaxmoxie/">
  <style>
    :root {
      --cream: #fff4e8;
      --chalk: #fffaf4;
      --matcha: #006b45;
      --mid: #3d6b4a;
      --pale: #e8f0e4;
      --ink: #2a3a2e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 48% 32% at 100% 0%, rgb(232 240 228 / 0.9), transparent 72%),
        radial-gradient(ellipse 40% 28% at 0% 100%, rgb(0 107 69 / 0.12), transparent 70%),
        var(--cream);
      padding: 2.5rem 1.25rem 3rem;
    }
    main {
      max-width: 34rem;
      margin: 0 auto;
      background: var(--chalk);
      border: 1px solid #b8c9b0;
      border-radius: 1rem;
      padding: 1.75rem 1.5rem 1.5rem;
      box-shadow: 0.2rem 0.25rem 0 rgba(61, 107, 74, 0.18);
    }
    .eyebrow {
      margin: 0 0 0.35rem;
      color: var(--mid);
      font-size: 0.95rem;
    }
    h1 {
      margin: 0 0 0.55rem;
      color: var(--matcha);
      font-size: 1.85rem;
    }
    p { line-height: 1.45; margin: 0 0 1rem; }
    ul { list-style: none; margin: 0; padding: 0; }
    li + li { margin-top: 0.6rem; }
    a { color: var(--matcha); font-weight: 700; text-underline-offset: 0.15em; }
    a:hover { color: #014f33; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">凤凰 · phoenix · cookie classroom</p>
    <h1>matchaxmoxie</h1>
    <p>A little more confidence, one line of code at a time.</p>
    <ul>
      <li><a href="portfolio.pdf">portfolio.pdf</a></li>
      <li><a href="https://jadexzhao.github.io/jadexzhao/">jadexzhao ships</a></li>
      <li><a href="https://github.com/matchaxmoxie">GitHub</a></li>
      <li><a href="mailto:jlzhao@iu.edu">jlzhao@iu.edu</a></li>
    </ul>
  </main>
</body>
</html>
